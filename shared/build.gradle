// 两端共用的 Java 17 类库；含在线来源、歌词解析及歌单领域逻辑。

plugins {
    id "java-library"
}
group = "app.musicplayer"
def versions = new Properties()
file("../version.properties").withInputStream { versions.load(it) }
version = versions.getProperty("versionName")
// 桌面和 Android 是独立构建，用工程名隔离输出，避免两种工具链互相覆盖。
layout.buildDirectory = file("build/${rootProject.name}")
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
dependencies {
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "org.jsoup:jsoup:1.18.3"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
