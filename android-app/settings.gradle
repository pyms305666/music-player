// Gradle 工程组成与仓库定义。指定构建名称和包含的模块，使桌面及 Android 两个独立构建引用同一 shared 源码。

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "simple-music-player-android"
include(":app")

include(":shared")
project(":shared").projectDir = file("../shared")
