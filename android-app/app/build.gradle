plugins {
    id "com.android.application"
}

def versions = new Properties()
rootProject.file("../version.properties").withInputStream { versions.load(it) }
def signingKeys = ["ZA_KEYSTORE", "ZA_STORE_PASSWORD", "ZA_KEY_ALIAS", "ZA_KEY_PASSWORD"]
def signingValues = signingKeys.collectEntries { [(it): System.getenv(it)] }
def configured = signingValues.values().count { it != null && !it.isBlank() }
if (configured != 0 && configured != signingKeys.size()) {
    throw new GradleException("Formal signing requires all four ZA signing environment variables")
}
android {
    namespace "app.musicplayer.android"
    compileSdk 35

    defaultConfig {
        applicationId "app.musicplayer.android"
        minSdk 28
        targetSdk 35
        versionCode versions.getProperty("versionCode").toInteger()
        versionName versions.getProperty("versionName")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (configured == signingKeys.size()) {
            formal {
                storeFile file(signingValues.ZA_KEYSTORE)
                storePassword signingValues.ZA_STORE_PASSWORD
                keyAlias signingValues.ZA_KEY_ALIAS
                keyPassword signingValues.ZA_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            if (configured == signingKeys.size()) signingConfig signingConfigs.formal
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(":shared")
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:core:1.6.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"

    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity:1.10.1"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.media3:media3-exoplayer:1.6.1"
    implementation "androidx.media3:media3-common:1.6.1"
    implementation "androidx.media3:media3-session:1.6.1"
    implementation "com.google.android.material:material:1.12.0"
    implementation "com.github.bumptech.glide:glide:4.16.0"
}

// Fail closed when requesting a release APK without the formal key configuration.
tasks.configureEach {
    if (name == "packageRelease") {
        doFirst {
            if (configured != signingKeys.size()) throw new GradleException("Release APK requires formal signing; use assembleDebug for the existing GitHub debug channel")
        }
    }
}
