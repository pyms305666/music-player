name: Build and verify
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'codex/**']
    tags: ['4.*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25.0.2'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Verify generated cache protection including real symbolic links
        run: |
          chmod +x gradlew
          ./gradlew :test --tests app.musicplayer.cache.GeneratedFileCacheTest --no-daemon --console=plain
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          report = ET.parse(pathlib.Path('build/test-results/test/TEST-app.musicplayer.cache.GeneratedFileCacheTest.xml'))
          case = next(item for item in report.findall('testcase') if item.get('name') == 'symbolicLinkDoesNotDeleteItsTarget()')
          assert case.find('skipped') is None, 'Symbolic link coverage must execute on Linux'
          assert case.find('failure') is None and case.find('error') is None
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-cache-${{ github.sha }}
          path: build/test-results/
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25.0.2'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Install WiX 5
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path .tools/wix
          ./.tools/wix/wix.exe extension add --global WixToolset.Util.wixext/5.0.2
      - name: Test and package Windows
        shell: pwsh
        run: ./package.ps1
      - name: Verify reproducible shared JAR
        shell: pwsh
        run: |
          $jar = Get-ChildItem shared/build/simple-music-player/libs/*.jar | Select-Object -First 1
          $before = (Get-FileHash $jar.FullName).Hash
          ./gradlew.bat :shared:jar --rerun-tasks --no-daemon --console=plain
          if ($LASTEXITCODE) { throw 'Rebuild failed' }
          if ((Get-FileHash $jar.FullName).Hash -ne $before) { throw 'Shared JAR is not reproducible' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-${{ github.sha }}
          path: |
            build/installer/**/*.exe
            build/installer/**/*.build.json
            build/test-results/
            shared/build/simple-music-player/test-results/
          if-no-files-found: error
  signing-rotation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [28, 31, 32, 33]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.19'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build rotation fixtures with disposable keys
        run: |
          chmod +x android-app/gradlew
          python3 scripts/rotation-qa.py prepare
      - name: Cover upgrade, subsequent upgrade, playback and clean install
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 -u scripts/rotation-qa.py run --qa --clean-install
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: signing-api-${{ matrix.api }}-test-only-${{ github.sha }}
          path: |
            .tools/rotation-ci/*.apk
            .tools/rotation-ci/*.apk.build.json
            .tools/rotation-ci/*.txt
            android-app/app/build/reports/
          include-hidden-files: true
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.19'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build native Android and run shared Java 17 tests
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew clean :shared:clean :shared:test assembleDebug assembleDebugAndroidTest lintDebug --no-daemon --console=plain
      - name: Playback service regression on emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android-app
          script: ./gradlew connectedDebugAndroidTest --no-daemon --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-ci-test-only-${{ github.sha }}
          path: |
            android-app/app/build/outputs/apk/
            android-app/app/build/reports/
            android-app/app/build/outputs/androidTest-results/
            shared/build/simple-music-player-android/test-results/
          if-no-files-found: error
